[project]
name = "aws-report"
version = "0.1.0"
description = "Generate a report of AWS resources"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.42.3",
]

[tool.ruff]
lint.select = [
    # Pyflakes
    "F",
    # Pycodestyle
    "E",
    "W",
    # isort
    "I",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # Pylint
    "PL"
]

[dependency-groups]
dev = [
    "ruff>=0.14.8",
]
